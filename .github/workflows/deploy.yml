name: Deploy

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: laptop

    defaults:
      run:
        working-directory: tf_config

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set environment based on branch
      shell: bash
      run: |
        if [ "${{ github.ref_name }}" = "main" ]; then
          echo "TF_ENV=prod" >> $GITHUB_ENV
        else
          echo "TF_ENV=dev" >> $GITHUB_ENV
        fi

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.15.7
        terraform_wrapper: false

    - name: Terraform Init
      run: terraform init -backend-config="path=C:/terraform-state/intens/${{ env.TF_ENV }}.tfstate" -reconfigure

    - name: Terraform Format
      run: terraform fmt -check

    - name: Terraform Plan
      run: terraform plan -input=false -var-file="envs/${{ env.TF_ENV }}.tfvars"

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false -var-file="envs/${{ env.TF_ENV }}.tfvars"
