{{- range $name, $svc := .Values.services }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ $name }}-test-connection"
  labels:
    {{- include "intens.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ $.Release.Name }}-{{ $name }}-service:{{ $svc.port }}']
  restartPolicy: Never
---
{{- end }}