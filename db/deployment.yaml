apiVersion: apps/v1
kind: Deployment
metadata:
  name: intens-db-deployment
spec:
  selector:
    matchLabels:
      app: intens-db
  replicas: 1
  template:
    metadata:
      labels:
        app: intens-db
    spec:
      containers:
      - name: intens-db
        image: postgres:16
        imagePullPolicy: Always
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "intens"
        - name: POSTGRES_PASSWORD
          value: "intens"
        - name: POSTGRES_DB
          value: "intens"