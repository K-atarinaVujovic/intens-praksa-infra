apiVersion: apps/v1
kind: Deployment
metadata:
  name: intens-fe-deployment
spec:
  selector:
    matchLabels:
      app: intens-fe
  replicas: 1
  template:
    metadata:
      labels:
        app: intens-fe
    spec:
      containers:
      - name: intens-fe
        image: intens-praksa-fe-server:20260702113858
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: API_HOST
          value: "intens-be-service"